# IFRS9 ETL — per-run model inputs
#
# UNIT CONVENTION (matches V4 production):
#   - Non-Oil GDP and GCC GDP values are in PERCENTAGE-POINTS (e.g. 4.44).
#   - REPI / DC values use the workbook-native scale; the
#     stress_unit_multiplier in config/model_config.yml.mevs handles the unit
#     conversion downstream.
#
# WEIGHT METHODOLOGY
#
#   - Internal scenario weights:  derived from Non-Oil GDP only, per the
#       IFRS_9_Scenarios_Probabilities_2025_V1.xlsx spreadsheet.
#       Algorithm (auto_non_oil_gdp_cdf):
#         1. μ, σ from historical Non-Oil GDP (data-raw/static/non_oil_gdp_history.csv).
#         2. For each forecast year y in {1..n_forecast_years} and each scenario s:
#               threshold[s,y] = mev_forecasts[y][GDP] + σ * severity_z[s]
#            P(s, y) under N(μ, σ) — band probabilities, residual to Base.
#         3. Final weight[s] = mean over forecast years of P(s, y).
#
#   - External scenario weights:  V7 production methodology, derived from
#       country-weighted GCC GDP via N(GCC_mean, GCC_sd) probability mass.
#       PER-YEAR (years 1..5) weights are applied to year-y marginal PD;
#       AVERAGE weights (mean of per-year) are applied to year 6+ marginal PD.
#       The country-weighted GCC GDP forecast for each year is computed in
#       code from external_gcc_country_growth and external_gcc_country_prices
#       below — equivalent to V7 Calculations!D62:H66 SUMPRODUCT.
#
#   - MEV model weights:  derived from regression p-values per PDF page 16.

# ============================================================================
# INTERNAL portfolios (lending: Business Finance, Off BS, Al Dhameen, Tasdeer)
# ============================================================================

internal_scenario_weights:
  # Modes:
  #   explicit             — V4 reproduction. Use literal explicit_weights.
  #                          Reproduces V4's hardcoded AE5:AE9 → 100% byte-match
  #                          to bundled Output/StPD.csv for internal portfolios.
  #                          NOTE: V4's stored values sum to 1.0003 due to a
  #                          transcription typo (AE8 = 0.1197 instead of the
  #                          methodology's 0.11942). This excess propagates
  #                          through the cumsum to make max pd_lifetime drift
  #                          to ~1.0003 for low-rated long-maturity buckets.
  #   auto_non_oil_gdp_cdf — Compute weights via the IFRS9 Scenarios
  #                          methodology (PDF p.16). Yields sum=1.0 exactly,
  #                          which keeps max pd_lifetime at the natural
  #                          asymptote of 1.0. Loses ~0.3% byte-match against
  #                          V4's bundled Output/StPD.csv for high-PD buckets,
  #                          but is methodologically correct.
  mode: auto_non_oil_gdp_cdf

  n_forecast_years: 2

  # V4 stored cell values from `Inputs_Lending Portfolio'!AE5:AE9.
  explicit_weights:
    "Significant Downturn": 0.1508
    "Slight Downturn":      0.1792
    "Base Case":            0.4799
    "Slight Uptrend":       0.1197
    "Significant Uptrend":  0.0707

# ============================================================================
# EXTERNAL portfolios (investments: Banks and Fis, Investments)
# ============================================================================

external_scenario_weights:
  # Modes:
  #   auto_gcc_cdf — V7 production: per-year + average weights from
  #                  N(year_y_weighted_GCC, gcc_sd). Recommended.
  #   explicit     — Use a single set of literal explicit_weights for every
  #                  year (and as the average for year 6+).
  mode: auto_gcc_cdf

  # Used only in `explicit` mode (year-1-equivalent reference values).
  explicit_weights:
    "Significant Downturn": 0.15709
    "Slight Downturn":      0.18770
    "Base Case":            0.48404
    "Slight Uptrend":       0.11139
    "Significant Uptrend":  0.05978

# Per-year, per-country GCC Real GDP Growth FORECASTS.
# Source: V7 Calculations!D38:H43. These are the inputs that drive both:
#   - the country-weighted GCC GDP forecast (= SUMPRODUCT of weights × growths)
#   - the country GDP-share-based weights (computed from external_gcc_country_prices).
# Each row is a country; values are years 1..n in percentage points.
external_gcc_country_growth:
  # year 1 forecasts (Calc!D38:D43), year 2 (E38:E43), ...
  # Order MUST match external_gcc_country_prices below.
  Bahrain:                [3.2,  2.9,  2.8, 2.8, 2.9]
  Kuwait:                 [3.3,  2.5,  2.6, 2.6, 2.6]
  Oman:                   [3.1,  4.4,  4.0, 3.6, 3.6]
  Qatar:                  [1.9,  5.8,  7.9, 3.5, 1.6]
  "Saudi Arabia":         [4.6,  4.4,  3.6, 3.5, 3.5]
  "United Arab Emirates": [5.1,  5.1,  4.7, 4.4, 4.3]

# Per-year, per-country GDP CURRENT PRICES (Billions USD).
# Used to compute country weights for each year:
#   weight[country, year] = price[country, year] / Σ_country price[*, year]
# Source: V7 Calculations!D46:H51.
external_gcc_country_prices:
  Bahrain:                [49.535,  51.694,  53.999,  56.495,  59.235]
  Kuwait:                 [161.95,  165.951, 171.06,  177.062, 183.69]
  Oman:                   [111.306, 116.185, 121.287, 126.559, 132.641]
  Qatar:                  [226.207, 242.135, 262.192, 273.785, 281.832]
  "Saudi Arabia":         [1136.58, 1199.156, 1262.326, 1332.093, 1409.058]
  "United Arab Emirates": [568.567, 601.759, 636.705, 673.519, 712.688]

# ============================================================================
# MEV model weights — applies to internal portfolios only
# ============================================================================
mev_model_weights:
  # Modes:
  #   from_model_config — V4 production: read weights from
  #                       config/model_config.yml.mevs[*].weight (V4: [1,0,0]).
  #   auto_p_value      — Compute from regression p-values (PDF p.16).
  mode: from_model_config

