# =============================================================================
# models.yml
#
# Registry of satellite PD models. Each model is named, references variables
# by `id` from variable_dictionary.yml, and carries its own coefficients
# and weights.
#
# To run a different model, edit `config.yml`:
#     run:
#       internal_model: internal_v4_production   # one of models below
#       external_model: external_gcc_v7
#
# To recalibrate without code changes, update the model entry's coefficients
# and weights here. To switch active variables, change which variables are
# listed under mev_components and re-balance weights.
#
# Provenance (per-coefficient): every numeric value is a calibration output;
# replace with new values when the model is re-fit. Track the source/date
# of each calibration in the `calibration` block.
# =============================================================================

schema_version: "1.0"

# ---------------------------------------------------------------------------
# Anchor: TTC PD constant in the stressing-factor formula
#   SF[t,mev] = NORM.S.INV(PD[t,mev]) - NORM.S.INV(ttc_anchor_pd)
# Single anchor for all models. Source: V4 Calculations!D31.
# ---------------------------------------------------------------------------
ttc_anchor_pd: 0.146


# ---------------------------------------------------------------------------
# Run-level horizon parameters. STATIC.
# ---------------------------------------------------------------------------
horizons:
  max_maturity: 50      # V4 Calculations!H3
  n_forecasts: 5        # V4 Calculations!G3


# ---------------------------------------------------------------------------
# MODELS
# ---------------------------------------------------------------------------
models:

  # =========================================================================
  # Internal — V4 production (Non-Oil GDP only, REPI/DC weight=0)
  # =========================================================================
  internal_v4_production:
    description: >
      V4 production model: 3 MEVs registered but only Non-Oil GDP is active
      (weight = 1.0; REPI = 0; DC = 0). Reproduces V4 byte-for-byte against
      the bundled StPD output.
    portfolios: ["Business Finance", "Off BS", "Al Dhameen", "Tasdeer"]
    rating_type: Internal
    calibration:
      source: "Updated_ETL_File__Test__V4_20211029_-_New_server_link.xlsm — Model Specifications sheet rows 5-7"
      date_reviewed: 2026-05-06
    mev_components:
      - variable: VAR_NON_OIL_GDP_GROWTH
        intercept:           -1.5474945421172901
        coefficient:         -0.0414145067387472
        p_value:              0.08
        standard_deviation:   9.8876910588664799
        weight:               1.0
      - variable: VAR_QATAR_REAL_ESTATE_INDEX_GROWTH
        intercept:           -1.7119854476587999
        coefficient:         -0.90045823075572
        p_value:              0.165
        standard_deviation:   0.21949278818348
        weight:               0.0
      - variable: VAR_QATAR_DOMESTIC_CREDIT_GROWTH
        intercept:           -1.27119835926007
        coefficient:         -4.58453325004525
        p_value:              0.241
        standard_deviation:   0.160242004480723
        weight:               0.0

  # =========================================================================
  # Internal — 3-variable PDF methodology (defined but not active by default)
  # =========================================================================
  # Same coefficients as v4_production but weights derived from the regression
  # p-values per the IFRS9 methodology PDF page 16:
  #     w_i  =  (1/p_i) / Σ_j (1/p_j)
  # Selecting this model swaps weights without touching coefficients —
  # demonstrating the win from variable-by-id indirection.
  internal_3var_pdf:
    description: >
      PDF methodology version: weights derived from p-values per
      IFRS_9_Scenarios_Probabilities document page 16. NOT V4-equivalent;
      will produce different StPD outputs than V4 production.
    portfolios: ["Business Finance", "Off BS", "Al Dhameen", "Tasdeer"]
    rating_type: Internal
    calibration:
      source: "Same coefficients as internal_v4_production; weights from PDF p.16"
      date_reviewed: 2026-05-06
    mev_components:
      - variable: VAR_NON_OIL_GDP_GROWTH
        intercept:           -1.5474945421172901
        coefficient:         -0.0414145067387472
        p_value:              0.08
        standard_deviation:   9.8876910588664799
        weight:               null              # null → derive from p_value
      - variable: VAR_QATAR_REAL_ESTATE_INDEX_GROWTH
        intercept:           -1.7119854476587999
        coefficient:         -0.90045823075572
        p_value:              0.165
        standard_deviation:   0.21949278818348
        weight:               null
      - variable: VAR_QATAR_DOMESTIC_CREDIT_GROWTH
        intercept:           -1.27119835926007
        coefficient:         -4.58453325004525
        p_value:              0.241
        standard_deviation:   0.160242004480723
        weight:               null

  # =========================================================================
  # External — GCC GDP single-variable (V7 production)
  # =========================================================================
  external_gcc_v7:
    description: >
      External-portfolio model: country-weighted GCC Real GDP Growth as the
      single MEV. Used for Banks/Investment portfolios.
    portfolios: ["Banks and Fis", "Investments"]
    rating_type: External
    calibration:
      source: "V7 Calculations sheet — country weights and growth forecasts"
      date_reviewed: 2026-05-06
    mev_components:
      - variable: VAR_GCC_REAL_GDP_GROWTH
        # External model uses cumulative-distribution weights from
        # N(GCC_mean, GCC_sd) directly — see model_inputs.external_scenario_weights.
        # No intercept/coefficient/SD here because the external pipeline
        # bypasses the satellite-regression step.
        intercept:           null
        coefficient:         null
        p_value:             null
        standard_deviation:  null
        weight:              1.0
