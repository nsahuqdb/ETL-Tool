# Macro model + run parameters
# Source: 'Model Specifications', 'Inputs_Lending Portfolio' sheets
# of Updated_ETL_File__Test__V4_20211029_-_New_server_link.xlsm
# Regenerated by data-raw/extract_from_xlsm.py — do not edit by hand
# unless you also update the source workbook.

model:
  name: "3-Variable Model (Non-Oil GDP only active)"

  # Through-the-cycle anchor PD used in the stressing-factor formula:
  #   SF[t,mev] = NORM.S.INV(PD[t,mev]) - NORM.S.INV(ttc_anchor_pd)
  # Source: hardcoded constant 0.146 in Calculations!D31 formula.
  ttc_anchor_pd: 0.146

  # Maximum maturity (years) for the PD term structure output.
  # Source: Calculations!H3 (default 50).
  max_maturity: 50

  # Number of MEV forecast horizons. Source: Calculations!G3 (default 5).
  n_forecasts: 5

  # Macroeconomic variables and their satellite-model parameters.
  # Source: 'Model Specifications' sheet rows 5-7 (D=intercept,
  # E=coefficient, F=p-value, G=weight, H=standard_deviation).
  #
  # NOTE on weights: in V4 (the current production workbook), only
  # Non-Oil GDP is active (weight=1, others=0). The PDF methodology
  # describes a 3-variable extended framework with weights derived
  # from p-values (~55%/27%/18%), but the V4 workbook overrides this
  # by setting REPI/DC weights to 0. The R port replicates V4
  # behaviour. To activate REPI/DC, update these weights here.
  #
  # NOTE on stress_unit_multiplier: this scales the standard deviation
  # when stressing the MEV forecast. Matches Excel's 'Calculations'!E9
  # formula `H6*100*z` for percentage-point MEVs (REPI, DC) where the
  # coefficient is in decimal-fraction space. The /unit_multiplier in
  # the logit calculation cancels the *100; net effect on the SF is
  # `SD * z * coef`.
  mevs:
    - name: "Non-Oil Real GDP (% Change)"
      intercept: -1.5474945421172901
      coefficient: -0.0414145067387472
      p_value: 0.08
      weight: 1.0
      standard_deviation: 9.8876910588664799
      stress_unit_multiplier: 1

    - name: "Qatari Real Estate Index Growth"
      intercept: -1.7119854476587999
      coefficient: -0.90045823075572
      p_value: 0.165
      weight: 0.0
      standard_deviation: 0.21949278818348
      stress_unit_multiplier: 100

    - name: "Qatari Domestic Credit Growth"
      intercept: -1.27119835926007
      coefficient: -4.58453325004525
      p_value: 0.241
      weight: 0.0
      standard_deviation: 0.160242004480723
      stress_unit_multiplier: 100
