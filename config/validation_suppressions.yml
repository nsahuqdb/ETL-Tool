# validation_suppressions.yml
#
# List of validator IDs the user has explicitly accepted as OK for this
# snapshot/configuration. A suppressed finding still RUNS and is recorded;
# it just gets effective_severity downgraded to "INFO" so gating doesn't
# halt the run.
#
# Add an entry by editing here directly, or via the Shiny Suppressions
# page (which calls add_suppression() and writes atomically).
#
# Each entry MUST have: validator_id, reason, approved_by, approved_at.
# Optional: valid_until (auto-expires the suppression past this date).
#
# Example (uncomment and edit as needed):
#
# suppressions:
#   - validator_id: INPUT_AccountMaster_dpd_nonneg
#     reason: |
#       Two contracts have legacy negative DPD values from a 2019 data-entry
#       error. Already in deferred-fix ticket #1234. Acceptable for Q1 close.
#     approved_by: priya
#     approved_at: 2026-04-15T10:00:00+0300
#     valid_until: 2026-12-31

schema_version: "1.0"
suppressions: []
