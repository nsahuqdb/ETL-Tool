paths:
  input_dir: input
  output_dir: output
  runs_dir: runs
  static_dir: data-raw/static
  data_drop_root: ''
  variable_dictionary: variable_dictionary.yml
  models: models.yml
  model_config: config/model_config.yml
  model_inputs: model_inputs.yml
run:
  internal_model: internal_v4_production
  external_model: external_gcc_v7
  on_validation_error: warn
  extract_date: '2025-12-31'
  overwrite: yes
  verbose: yes
  max_upload_size_mb: 500
logging:
  log_file: output/etl_run.log
  level: INFO
approval:
  enforce_separation_of_duties: no

